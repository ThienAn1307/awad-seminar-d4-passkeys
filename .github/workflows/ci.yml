name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      # Cross-check on Linux of the committed Windows runs (method.md sections 9 and 11).
      - run: npm run measure
      - run: npm run check:conditional-create
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ci
          path: results/
